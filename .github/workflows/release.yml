name: Release

# Fires on a pushed semver tag (v1.2.3). Builds the web app + a Windows desktop
# build, attaches both to a GitHub Release, and deploys the web build to GitHub
# Pages so the static app is served live.
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write # create the release + upload assets
  pages: write # deploy to GitHub Pages
  id-token: write # Pages deployment auth

# The repo name becomes the Pages sub-path (https://<user>.github.io/<repo>/),
# so the web build must use a matching --base-href.

jobs:
  # ---- Web build + GitHub Pages deploy ----
  web:
    runs-on: ubuntu-latest
    env:
      # Fine-grained PAT with Contents:Read on HexaJohn/acro-space-assets
      # (private). Unset (e.g. forked PRs) -> model skipped, craft procedural.
      ASSETS_TOKEN: ${{ secrets.ASSETS_TOKEN }}
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      # Web gets a SMALLER, lower-res bake (apollo-web.fsceneb), NOT the full
      # 86 MB apollo.fsceneb: bundling the big binary makes the GitHub Pages
      # server-side build fail ("Deployment failed, try again later") even
      # under the documented 100 MB/file & 1 GB/site limits, and Release
      # assets aren't CORS-enabled so it can't be fetched at runtime either.
      # `|| true`: until the web bake is published to the assets repo the
      # fetch matches nothing — the build still deploys and the craft renders
      # from the procedural Apollo fallback.
      - name: Fetch web craft model (small)
        if: env.ASSETS_TOKEN != ''
        env:
          GH_TOKEN: ${{ env.ASSETS_TOKEN }}
        run: gh release download --repo HexaJohn/acro-space-assets --pattern "apollo-web.fsceneb" --dir assets/mesh || echo "apollo-web.fsceneb not published yet; web craft uses the procedural fallback"
      # flutter_scene / Flutter GPU track a pinned master commit (.fvmrc);
      # stable can't resolve the deps (vector_math 2.2.0 vs 2.4.0) or build the
      # GPU backend. Check out the exact pinned commit so CI == local dev.
      - name: Set up pinned Flutter master (.fvmrc)
        shell: bash
        run: |
          REF=$(jq -r .flutter .fvmrc)
          git clone https://github.com/flutter/flutter.git "$RUNNER_TEMP/flutter"
          git -C "$RUNNER_TEMP/flutter" checkout "$REF"
          echo "$RUNNER_TEMP/flutter/bin" >> "$GITHUB_PATH"
      - run: flutter --version
      - run: flutter pub get
      - name: Build web
        run: |
          flutter build web --release \
            --base-href "/${{ github.event.repository.name }}/" \
            --pwa-strategy=none
      - name: Package web build
        run: |
          cd build/web && zip -r ../../acro-web-${{ github.ref_name }}.zip .
      - uses: actions/upload-artifact@v4
        with:
          name: web-zip
          path: acro-web-${{ github.ref_name }}.zip
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: build/web
      - name: Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v4

  # ---- Windows desktop build ----
  windows:
    runs-on: windows-latest
    env:
      # Fine-grained PAT with Contents:Read on HexaJohn/acro-space-assets
      # (private). Unset (e.g. forked PRs) -> models skipped, craft renders
      # as procedural part meshes.
      ASSETS_TOKEN: ${{ secrets.ASSETS_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      # Licensed craft model: never committed to this repo; the full-res
      # apollo.fsceneb is fetched from the private assets repo for the desktop
      # zip only. (The web build bundles the smaller apollo-web.fsceneb — see
      # the web job — because Pages can't build the 86 MB binary.)
      - name: Fetch licensed craft model (full)
        if: env.ASSETS_TOKEN != ''
        env:
          GH_TOKEN: ${{ env.ASSETS_TOKEN }}
        run: gh release download --repo HexaJohn/acro-space-assets --pattern "apollo.fsceneb" --dir assets/mesh
      # Same pinned Flutter master as the web job (see .fvmrc).
      - name: Set up pinned Flutter master (.fvmrc)
        shell: bash
        run: |
          REF=$(jq -r .flutter .fvmrc)
          git clone https://github.com/flutter/flutter.git "$RUNNER_TEMP/flutter"
          git -C "$RUNNER_TEMP/flutter" checkout "$REF"
          echo "$RUNNER_TEMP/flutter/bin" >> "$GITHUB_PATH"
      - run: flutter --version
      - run: flutter config --enable-windows-desktop
      - run: flutter pub get
      - run: flutter build windows --release
      - name: Package Windows build
        run: Compress-Archive -Path build/windows/x64/runner/Release/* -DestinationPath acro-windows-${{ github.ref_name }}.zip
      - uses: actions/upload-artifact@v4
        with:
          name: windows-zip
          path: acro-windows-${{ github.ref_name }}.zip

  # ---- Create the GitHub Release with both build artifacts ----
  release:
    needs: [web, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: web-zip
      - uses: actions/download-artifact@v4
        with:
          name: windows-zip
      - name: Create / update the release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            acro-web-${{ github.ref_name }}.zip
            acro-windows-${{ github.ref_name }}.zip
